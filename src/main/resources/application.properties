spring.application.name=qms

spring.jwt.secret=${JWT_SECRET_KEY}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

server.port=8080

spring.profiles.active=dev

spring.mail.host=${MAIL_SENDER_IP}
spring.mail.port=25

# Apagamos la seguridad local porque delegamos esto a Postfix
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# =============================================================================
#  Asistentes de IA (n8n + Gemini)
# =============================================================================
#  El navegador NUNCA llama a n8n. Llama a este backend, que valida el JWT y
#  reenvia por la red interna. Ver clinicore-infra/README.md.
#
#  Base del webhook:
#    - desarrollo local : http://localhost:5678/webhook   (n8n en Docker con el
#                         puerto publicado; Spring corre en el host)
#    - servidor         : http://n8n:5678/webhook         (DNS interno de Docker)
#
#  IMPORTANTE: es /webhook, no /webhook-test. La ruta de prueba solo responde
#  mientras se mantiene apretado "Test workflow" en el editor. Para que este
#  endpoint funcione hay que PUBLICAR (activar) el workflow en n8n.
n8n.webhook-base=${N8N_WEBHOOK_BASE:http://localhost:5678/webhook}

#  Secreto compartido. N8nClient lo manda en el header X-Internal-Secret y el
#  nodo Webhook de n8n lo valida con "Header Auth". Es lo que impide que
#  alguien que descubra la URL dispare los flujos sin pasar por el backend.
n8n.shared-secret=${N8N_SHARED_SECRET:}

#  n8n llama a Gemini, que con reintentos puede tardar. Un read timeout corto
#  cortaria resumenes validos; uno infinito deja al medico esperando para
#  siempre con el paciente enfrente.
n8n.connect-timeout-seconds=10
n8n.timeout-seconds=60

#  Tope de encuentros que entran al resumen. Lo que queda afuera se informa en
#  la respuesta (totalEncuentros vs encuentrosResumidos), nunca en silencio.
ai.summary.max-encounters=20

#  Tope del chat publico. Unico POST anonimo que gasta tokens de un tercero:
#  sin limite, un script agota la cuota de Gemini y el chat deja de andar para
#  los pacientes reales. Es en memoria y por IP — ver ChatRateLimiter para sus
#  limitaciones. La barrera de verdad va en nginx (limit_req_zone).
ai.chat.rate-limit.max-per-window=10
ai.chat.rate-limit.window-seconds=60
ai.chat.rate-limit.max-tracked-clients=10000
