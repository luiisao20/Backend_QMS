<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificación</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333333;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .header {
            background-color: #0b2e59;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .content {
            padding: 30px;
            line-height: 1.6;
        }
        .content h2 {
            color: #0076c0;
            margin-top: 0;
        }
        .footer {
            background-color: #f1f1f1;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #777777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 th:text="${tituloNotificacion}">Información Importante</h1>
        </div>
        <div class="content">
            <h2 th:text="'Hola, ' + ${nombreUsuario}">Hola, Usuario</h2>
            <p th:text="${mensajeCuerpo}">Este es el cuerpo del mensaje de la notificación generada.</p>
            <br>
            <p>Saludos cordiales,<br>El equipo de administración</p>
        </div>
        <div class="footer">
            <p>Este es un correo informativo, por favor no respondas a esta dirección.</p>
        </div>
    </div>
</body>
</html>
